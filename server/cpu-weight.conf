# CPU priority for a public game account's sessions. Installed as
# /etc/systemd/system/user-<uid>.slice.d/50-invaders.conf for each game
# account by install-ssh.sh.
#
# A weight, not a cap: games can use the whole CPU while nothing else
# wants it. Under contention, slices at the default weight of 100 (the
# admin's logins, system services) are served first, so the server stays
# reachable however many people are playing.
[Slice]
CPUWeight=20
