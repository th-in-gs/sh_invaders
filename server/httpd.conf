# BusyBox httpd configuration for invaders.now.
#
# No authentication, no directory listing. The docroot has no
# index.html, so / falls through to cgi-bin/index.cgi, which sends the
# game to curl and a small page to browsers. Nothing else in the docroot
# is run; any other path is a static file (certbot's challenges) or 404.
H:/srv/www
