# Public game accounts. Empty passwords, no forwarding, no shell.
# See server/README.md in the sh_invaders repository.
Match User game,ascii,9600,play
    PasswordAuthentication yes
    PermitEmptyPasswords yes
    DisableForwarding yes
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
    ForceCommand /usr/local/bin/invaders-login
    ClientAliveInterval 30
    ClientAliveCountMax 3
