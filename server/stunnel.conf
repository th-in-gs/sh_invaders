# TLS front end: terminate on 443, hand the plain HTTP request to the
# sandboxed BusyBox handler on loopback. Nothing else is served.

foreground = yes
debug = 4
pid =

# Drop privileges once the certificate and key are loaded.
setuid = stunnel4
setgid = stunnel4

[invaders]
accept = 443
connect = 127.0.0.1:8080
cert = /etc/letsencrypt/live/invaders.now/fullchain.pem
key = /etc/letsencrypt/live/invaders.now/privkey.pem
sslVersionMin = TLSv1.2
socket = l:TCP_NODELAY=1
socket = r:TCP_NODELAY=1
